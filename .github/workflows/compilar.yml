name: Compilar libro

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          args: -pdf -file-line-error -interaction=nonstopmode

      - name: Subir PDF y log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mecanica-distribuciones
          path: |
            main.pdf
            main.log
          if-no-files-found: warn
